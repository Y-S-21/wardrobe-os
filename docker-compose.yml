version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: wardrobe-db
    environment:
      POSTGRES_USER: wardrobe
      POSTGRES_PASSWORD: wardrobe_dev_password
      POSTGRES_DB: wardrobe_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
